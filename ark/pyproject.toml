[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortcloud-ark"
version = "0.1.0"
description = "Restore is a feature, not a hope — backup coverage and restore evidence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FortCloud contributors" }]
keywords = [
  "resilience",
  "backup",
  "restore",
  "disaster-recovery",
  "rto",
  "rpo",
  "evidence",
  "immutable",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "build>=1",
]

[project.scripts]
fortcloud-ark = "fortcloud_ark.cli:main"

[project.urls]
Homepage = "https://github.com/fabriqant/fortcloud-io/tree/main/ark"
Issues = "https://github.com/fabriqant/fortcloud-io/issues"
Changelog = "https://github.com/fabriqant/fortcloud-io/blob/main/ark/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortcloud_ark = ["py.typed"]
