# Business services — SOURCE OF TRUTH
# rto : maximum time to restore; rpo : maximum acceptable data loss
# Format: 0 or <number><s|m|h|d>
version: 1
services:
  - id: identity-auth
    name: User authentication
    description: Sign-in, session renewal and token revocation.
    criticality: P0
    owner: sec-team
    availability_target: 99.99%
    rto: 15m
    rpo: "0"
    components: [idp-oidc, dns-global, vault-secrets]

  - id: order-to-cash
    name: Order to cash
    description: Order persistence, authentication and accounting entries.
    criticality: P0
    owner: commerce-team
    availability_target: 99.95%
    rto: 30m
    rpo: 5m
    components: [pg-core, dns-global, idp-oidc, vault-secrets]

  - id: analytics-ingestion
    name: Analytics ingestion
    description: Feeds the data lake for dashboards.
    criticality: P1
    owner: data-platform
    availability_target: 99.50%
    rto: 4h
    rpo: 1h
    components: [kafka-bus, obj-lake]
