[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortcloud-crucible"
version = "0.1.0"
description = "Rehearse the outage before it happens — controlled failure drills, communication and verification"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FortCloud contributors" }]
keywords = [
  "resilience",
  "chaos-engineering",
  "drill",
  "failover",
  "restore",
  "recovery",
  "verification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "build>=1",
]

[project.scripts]
fortcloud-crucible = "fortcloud_crucible.cli:main"

[project.urls]
Homepage = "https://github.com/fabriqant/fortcloud/tree/main/crucible"
Issues = "https://github.com/fabriqant/fortcloud/issues"
Changelog = "https://github.com/fabriqant/fortcloud/blob/main/crucible/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortcloud_crucible = ["py.typed"]
