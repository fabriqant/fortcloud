[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortcloud-failover"
version = "0.1.0"
description = "Design out the single point of failure — failover plans and coverage matrices"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fortcloud contributors" }]
keywords = [
  "resilience",
  "failover",
  "spof",
  "disaster-recovery",
  "rto",
  "rpo",
  "drills",
  "infrastructure",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "build>=1",
]

[project.scripts]
fortcloud-failover = "fortcloud_failover.cli:main"

[project.urls]
Homepage = "https://github.com/fabriqant/fortcloud-io/tree/main/failover"
Issues = "https://github.com/fabriqant/fortcloud-io/issues"
Changelog = "https://github.com/fabriqant/fortcloud-io/blob/main/failover/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortcloud_failover = ["py.typed"]
