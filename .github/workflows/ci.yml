name: Fortcloud Atlas — CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: atlas

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: atlas/requirements.txt

      - name: Install
        run: python -m pip install -e .

      - name: Smoke test
        run: fortcloud-atlas --version

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate model and generate artifacts
        run: fortcloud-atlas check --out ./artifacts

      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fortcloud-atlas-report
          path: atlas/artifacts

  failover-test-and-report:
    runs-on: ubuntu-latest
