tools:
  - id: atlas
    name: FortCloud Atlas
    tagline: Map dependencies. See risk.
    description: Atlas models infrastructure dependencies as a validated graph and audit. It exposes single points of failure, single-region P0 components, FMEA risks and RTO/RPO coverage from components.yaml, dependencies.yaml, flows.yaml and risks.yaml. Check rebuilds the dependency graph and resilience report so every claim can be traced back to the model.
    accent: red
    icon: network
    artifacts:
      - name: dependency-graph.md
        label: Dependency graph
        kind: mermaid
      - name: resilience-report.md
        label: Resilience report
        kind: markdown

  - id: failover
    name: FortCloud Failover
    tagline: Design out failure.
    description: Failover models topology, services, strategies and drills to prove a switchover is real. It checks paired primaries and standbys, detection plus promotion against RTO, replication against RPO, capacity and DNS TTL, and drill freshness. Check produces a coverage matrix, remediation plan, drill checklist and CI status.
    accent: orange
    icon: shuffle
    artifacts:
      - name: failover-matrix.md
        label: Failover matrix
        kind: markdown
      - name: failover-plan.md
        label: Failover plan
        kind: markdown
      - name: drill-scenarios.md
        label: Drill scenarios
        kind: markdown
      - name: failover-status.json
        label: Status
        kind: json

  - id: ark
    name: FortCloud Ark
    tagline: Prove restores work.
    description: Ark models data assets, backup policies and dated restore evidence. It checks P0 coverage, immutability, encryption, schedule versus RPO, measured RTO/RPO and restore scenarios, then publishes backup coverage, restore evidence, recovery plan and CI status. A backup is only real when a dated test has measured the restore.
    accent: amber
    icon: archive
    artifacts:
      - name: backup-coverage.md
        label: Backup coverage
        kind: markdown
      - name: restore-evidence.md
        label: Restore evidence
        kind: markdown
      - name: recovery-plan.md
        label: Recovery plan
        kind: markdown
      - name: restore-status.json
        label: Status
        kind: json

  - id: ballast
    name: FortCloud Ballast
    tagline: Keep latency honest.
    description: Ballast models outbound calls, resilience policies and ordered flows to keep latency promises under failure. It computes worst-case timeout budgets, checks retries, jitter, breakers, bulkheads and fallbacks, and flags non-idempotent retries or coarsely budgeted chains. Check emits timeout budget, policy matrix, remediation plan and CI status.
    accent: blue
    icon: gauge
    artifacts:
      - name: timeout-budget.md
        label: Timeout budget
        kind: markdown
      - name: policy-matrix.md
        label: Policy matrix
        kind: markdown
      - name: resilience-plan.md
        label: Resilience plan
        kind: markdown
      - name: ballast-status.json
        label: Status
        kind: json

  - id: vitals
    name: FortCloud Vitals
    tagline: Measure what works.
    description: Vitals models services, signals, SLOs and verification checks to turn monitoring into evidence. It matches signal kinds and intervals to objectives, checks alert thresholds against error budgets, requires data-quality objectives and runbooks for P0 services, and flags stale checks. Check emits an SLO dashboard, signal catalog, quality plan and CI status.
    accent: green
    icon: activity
    artifacts:
      - name: slo-dashboard.md
        label: SLO dashboard
        kind: markdown
      - name: signal-catalog.md
        label: Signal catalog
        kind: markdown
      - name: quality-plan.md
        label: Quality plan
        kind: markdown
      - name: vitals-status.json
        label: Status
        kind: json

  - id: custodian
    name: FortCloud Custodian
    tagline: Make access auditable.
    description: Custodian models identities, grants, secrets, audit sinks and deployment pipelines. It enforces least privilege, environment isolation, reference-only secrets, rotation, immutable audit sinks and reviewed deployments with verified rollback. Check generates access and secret inventories, change control, audit trail and CI status.
    accent: violet
    icon: shield
    artifacts:
      - name: access-matrix.md
        label: Access matrix
        kind: markdown
      - name: secret-inventory.md
        label: Secret inventory
        kind: markdown
      - name: change-control.md
        label: Change control
        kind: markdown
      - name: audit-trail.md
        label: Audit trail
        kind: markdown
      - name: custodian-status.json
        label: Status
        kind: json

  - id: crucible
    name: FortCloud Crucible
    tagline: Rehearse the outage.
    description: Crucible models failure drills, participants, channels, verification and sign-offs. It enforces controlled-environment rehearsals before production exercises, four named roles, notification cadence and passed service/data checks with evidence. Check emits scenario plan, roles matrix, communication plan, verification report and CI status.
    accent: pink
    icon: flask
    artifacts:
      - name: scenario-plan.md
        label: Scenario plan
        kind: markdown
      - name: roles-matrix.md
        label: Roles matrix
        kind: markdown
      - name: communication-plan.md
        label: Communication plan
        kind: markdown
      - name: verification-report.md
        label: Verification report
        kind: markdown
      - name: crucible-status.json
        label: Status
        kind: json
