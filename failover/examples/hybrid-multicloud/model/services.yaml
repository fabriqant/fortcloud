# Business services — SOURCE OF TRUTH
# rto : maximum time to restore; rpo : maximum acceptable data loss
# Format: 0 or <number><s|m|h|d>
version: 1
services:
  - id: identity-auth
    name: Authentification des utilisateurs
    description: Connexion, renouvellement de session et révocation des tokens.
    criticality: P0
    owner: sec-team
    availability_target: 99.99%
    rto: 15m
    rpo: "0"
    components: [idp-oidc, dns-global, vault-secrets]

  - id: order-to-cash
    name: Commande jusqu'à encaissement
    description: Persistance de la commande, authentification et écriture comptable.
    criticality: P0
    owner: commerce-team
    availability_target: 99.95%
    rto: 30m
    rpo: 5m
    components: [pg-core, dns-global, idp-oidc, vault-secrets]

  - id: analytics-ingestion
    name: Ingestion analytique
    description: Alimentation du lac de données pour les tableaux de bord.
    criticality: P1
    owner: data-platform
    availability_target: 99.50%
    rto: 4h
    rpo: 1h
    components: [kafka-bus, obj-lake]
