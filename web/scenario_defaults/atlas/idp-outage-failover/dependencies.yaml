# Directed dependency graph — SOURCE OF TRUTH
# Convention: `from` is the component THAT DEPENDS ON `to`.
# Many inbound arrows to one node = large blast radius.
# kind: data | control | identity | network | dns | secret | config
version: 1
dependencies:
  - id: d-001
    from: k8s-control
    to: dns-global
    kind: dns
    required: true
    description: Internal and external name resolution for the cluster.

  - id: d-002
    from: pg-core
    to: dns-global
    kind: dns
    required: true
    description: Endpoint resolution for replication.

  - id: d-003
    from: idp-oidc
    to: dns-global
    kind: dns
    required: true
    description: Publication of the OIDC discovery endpoints.

  - id: d-004
    from: payments-api
    to: dns-global
    kind: dns
    required: true
    description: Public resolution of the external API.

  - id: d-005
    from: pg-core
    to: network-hub
    kind: network
    required: true
    description: Inter-site link for replication to the DC.

  - id: d-006
    from: k8s-control
    to: network-hub
    kind: network
    required: true
    description: Connectivity for hybrid workloads.

  - id: d-007
    from: etl-workers
    to: network-hub
    kind: network
    required: true
    description: Access to on-prem sources.

  - id: d-008
    from: k8s-control
    to: idp-oidc
    kind: identity
    required: true
    description: Authentication of users and service accounts.

  - id: d-009
    from: pg-core
    to: idp-oidc
    kind: identity
    required: true
    description: Access control via federated roles.

  - id: d-010
    from: idp-oidc
    to: vault-secrets
    kind: secret
    required: true
    description: Storage of signing keys and certificates.

  - id: d-011
    from: pg-core
    to: vault-secrets
    kind: secret
    required: true
    description: Retrieval of database credentials.

  - id: d-012
    from: etl-workers
    to: vault-secrets
    kind: secret
    required: true
    description: Retrieval of processing tokens.

  - id: d-013
    from: etl-workers
    to: k8s-control
    kind: control
    required: true
    description: Pod scheduling and restart.

  - id: d-014
    from: argocd
    to: k8s-control
    kind: control
    required: true
    description: Application of GitOps manifests.

  - id: d-015
    from: etl-workers
    to: kafka-bus
    kind: data
    required: true
    description: Consumption of incoming events.

  - id: d-016
    from: kafka-bus
    to: pg-core
    kind: data
    required: true
    description: Change data capture (CDC) from the database.

  - id: d-017
    from: etl-workers
    to: obj-lake
    kind: data
    required: true
    description: Write of transformed data to the lake.

  - id: d-018
    from: etl-workers
    to: payments-api
    kind: data
    required: true
    description: Call to the external payment API.

  - id: d-019
    from: pg-core
    to: observability
    kind: control
    required: false
    description: Export of metrics and alerts.

  - id: d-020
    from: etl-workers
    to: observability
    kind: control
    required: false
    description: Processing traces and logs.
