# Business services and their end-to-end latency budget — SOURCE OF TRUTH
# latency_budget : 0 or <number><ms|s|m|h|d>, combinable (1m30s, 200ms)
# Every flow attached to a service must fit within this budget.
version: 1
services:
  - id: checkout
    name: Order API
    description: Order placement and payment.
    criticality: P0
    owner: commerce-team
    latency_budget: 3s

  - id: identity-auth
    name: Authentication
    description: Session and token verification.
    criticality: P0
    owner: sec-team
    latency_budget: 1s

  - id: catalog-browse
    name: Catalog browsing
    description: Product search and display.
    criticality: P1
    owner: catalog-team
    latency_budget: 2s

  - id: checkout-reporting
    name: Order reporting
    description: Consolidation of pricing and audit events.
    criticality: P2
    owner: analytics-team
    latency_budget: 5s
