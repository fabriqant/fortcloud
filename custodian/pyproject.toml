[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortcloud-custodian"
version = "0.1.0"
description = "Guard access. Prove every change — least privilege, secrets, change control and audit evidence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fortcloud contributors" }]
keywords = [
  "resilience",
  "least-privilege",
  "secrets",
  "change-control",
  "audit",
  "iam",
  "deployment",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "build>=1",
]

[project.scripts]
fortcloud-custodian = "fortcloud_custodian.cli:main"

[project.urls]
Homepage = "https://github.com/fabriqant/fortcloud-io/tree/main/custodian"
Issues = "https://github.com/fabriqant/fortcloud-io/issues"
Changelog = "https://github.com/fabriqant/fortcloud-io/blob/main/custodian/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortcloud_custodian = ["py.typed"]
