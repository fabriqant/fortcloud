[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fortcloud-vitals"
version = "0.1.0"
description = "Health and data quality, one signal — SLOs, error budgets and evidence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Fortcloud contributors" }]
keywords = [
  "resilience",
  "slo",
  "sli",
  "error-budget",
  "data-quality",
  "monitoring",
  "observability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "build>=1",
]

[project.scripts]
fortcloud-vitals = "fortcloud_vitals.cli:main"

[project.urls]
Homepage = "https://github.com/fabriqant/fortcloud-io/tree/main/vitals"
Issues = "https://github.com/fabriqant/fortcloud-io/issues"
Changelog = "https://github.com/fabriqant/fortcloud-io/blob/main/vitals/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortcloud_vitals = ["py.typed"]
