# Request call chains — SOURCE OF TRUTH
# Each step references a dependency and the policy that guards it.
# The sum of worst-case step times must stay below the service latency budget.
version: 1
flows:
  - id: flow-checkout
    name: Passage de commande
    service: checkout
    steps:
      - dependency: dep-auth
        policy: pol-auth
      - dependency: dep-inventory
        policy: pol-inventory
      - dependency: dep-payment
        policy: pol-payment

  - id: flow-login
    name: Connexion utilisateur
    service: identity-auth
    steps:
      - dependency: dep-auth
        policy: pol-auth

  - id: flow-browse
    name: Recherche catalogue
    service: catalog-browse
    steps:
      - dependency: dep-catalog
        policy: pol-catalog
      - dependency: dep-search
        policy: pol-search

  - id: flow-reporting
    name: Consolidation des rapports
    service: checkout-reporting
    steps:
      - dependency: dep-pricing
        policy: pol-pricing
      - dependency: dep-audit
        policy: pol-audit
