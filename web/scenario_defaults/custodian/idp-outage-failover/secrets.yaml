# Secret inventory — REFERENCES ONLY, never values — SOURCE OF TRUTH
# reference : vault://... | aws-secrets-manager://... | ${ENV_VAR}
# environments must be isolated: a secret shared with prod is an error.
version: 1
secrets:
  - id: sec-checkout-db
    name: Checkout database password
    store: vault
    reference: vault://prod/checkout/db
    environments: [prod]
    owner: platform-team
    last_rotated: "2026-10-01"
    rotation_days: 90
    used_by: [ci-deploy, svc-checkout]

  - id: sec-checkout-api
    name: Checkout gateway API key
    store: vault
    reference: vault://prod/checkout/api
    environments: [prod]
    owner: commerce-team
    last_rotated: "2026-11-20"
    rotation_days: 90
    used_by: [svc-checkout]
    notes: Gateway key rotated during the IdP outage rehearsal.

  - id: sec-staging-db
    name: Staging database password
    store: aws-secrets-manager
    reference: aws-secrets-manager://staging/reporting/db
    environments: [staging]
    owner: analytics-team
    last_rotated: "2026-11-01"
    rotation_days: 90
    used_by: [svc-reporting]

  - id: sec-reporting-export-key
    name: Analytics export key
    store: gcp-secret-manager
    reference: gcp-secret-manager://staging/reporting/export-key
    environments: [staging]
    owner: analytics-team
    last_rotated: "2026-03-01"
    rotation_days: 90
    used_by: [svc-reporting]
    notes: Overdue rotation on a non-restricted environment.

  - id: sec-ci-token
    name: CI deployment token
    store: vault
    reference: vault://prod/ci/deploy-token
    environments: [prod]
    owner: platform-team
    last_rotated: "2026-11-20"
    rotation_days: 90
    used_by: [ci-deploy]
    notes: Rotation aligned with policy during the IdP outage rehearsal.

  - id: sec-legacy-token
    name: Legacy staging token
    store: k8s-secret
    reference: ${LEGACY_TOKEN_REF}
    environments: [staging]
    owner: analytics-team
    last_rotated: "2026-09-01"
    rotation_days: 90
    used_by: [svc-reporting]
